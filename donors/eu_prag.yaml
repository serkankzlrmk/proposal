    - "context_relevance"
    - "methodology"
    - "capacity"
    - "cost_effectiveness"
    - "sustainability_visibility"

max_char_limits:
  context_relevance: 4500
  methodology: 5000
  capacity: 3500
  cost_effectiveness: 4000
  sustainability_visibility: 3500

min_source_ratio: 0.80        # High academic and baseline study citation density
overhead_cap_percent: 7.0

mandatory_keywords:
  - "eu visibility"
  - "theory of change"
  - "local partnership"
  - "multiplier effect"
  - "cost-effectiveness"

smart_indicators:
  required_dimensions: [specific, measurable, achievable, relevant, time_bound]

hard_eligibility_gates:
  min_capacity_score: 12.0    # Must score >= 12/20 on institutional capacity

pass_threshold: 70
