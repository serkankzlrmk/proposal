# donors/eu_prag.yaml — European Union / EuropeAid (PRAG & ECHO)
# Root-level declarative manifest (canonical — Master Spec §2.2 / ARCHITECTURAL_DECISIONS #1)
donor_id: "eu_prag"
display_name: "European Union / EuropeAid (PRAG)"
template_standard: "PRAG Annex e3b"
version: "1.1.0"
currency: "EUR / USD"

scoring_weights:
