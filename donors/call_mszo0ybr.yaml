  requirements:
  - Proposals must be submitted via email to unfpa.turkey.grant@unfpa.org.
  - Proposals must be clearly marked 'Grant Call for the Prevention of CEFM'.
  - Proposals must be submitted in English.
  - Copy of provisions of legal status of the non-governmental organization (NGO)
    in Türkiye is required.
  - Attachment I – NGO Profile and Programme Proposal must be included.
  - Attachment II – Proposed Budget (max TRY 1,000,000) must be included.
  - Attachment III - List of Indicators Template must be included.
  - Latest annual report and audit report (as separate documents or hyperlink) must
    be included.
  - Proposals must address the prevention of CEFM.
  - Proposals must contribute to UNFPA’s 7th Country Programme (2021-2025) outputs
    1.1 and 2.1.
  - 'Proposals must contribute to outcomes: ''Children and women at risk/survivors
    of CEFM have better access to quality protection and response services in line
    with international standards'' AND ''Social norms and attitudes favorable towards
    ending CEFM are promoted in targeted areas''.'
  - Organizations must have a clearly defined mission and goals that reflect the organization’s
    structure and context, as well as alignment to UNFPA priority areas.
  - The organization must not have a history of fraud, complaints or service delivery
    issues.
  - The organization must have sufficient staff resources and technical expertise
    to implement the proposed activities.
  - The organization must not have conflicts of interest with UNFPA or its personnel
    that cannot be effectively mitigated.
  - The organization’s mission and/or strategic plan must focus on at least one of
    the UNFPA’s programme areas.
  - The organization must have relevant community presence and ability to reach the
    target audience; especially vulnerable populations and hard-to-reach areas.
  - The organization must operate in provinces where CEFM is prevalent.
  - The organization must have a proven track record of working with women and girls
    (e.g. at risk of/survivors of CEFM); youth (not in employment, education or training,
    adolescents/at risk of child marriages, living with disabilities); Rural populations;
    Migrant agricultural populations; Roma population.
  - The organization must have at least a minimum level of capacity to systematically
    collect, and report on programme monitoring data.
  - The organization must have/had partnerships with the government and other relevant
    local, international and private sector entities.
  - The organization must have/had collaboration with the municipalities.
  - The organization must have established policies or practices to reduce the environmental
    impact of its activities. If no policies exist, the organization must not have
    a history of its activities causing negative impact to the environment.
  - The proposed programme duration must be for a maximum of 12 months.
  - The budget must not exceed TRY 1,000,000.
  - The budget must clearly indicate estimated costs of each result as a separate
    component.
  - The budget must clearly indicate estimated cost of each training course separately.
  - The budget must include a 'SUPPORT COST' line item.
  - The proposal must include a conflict of interest statement.
  - The proposal must include a fraud statement.
  - The proposal must outline the organization’s mandate and field of work, and how
    it aligns to UNFPA’s mandate.
  - The proposal must outline the distinctive technical capacity of the organization
    to achieve results in the proposed programmatic area.
  - The proposal must outline type/scope and key results achieved in proposed programmatic
    areas in recent years, including any recognition received at local / global level
    for the work in the proposed area, and experience in Türkiye and prior experience
    with any organization of the United Nations.
  - The proposal must outline presence and community relations in the location(s)
    the activities will be implemented in, including access to vulnerable populations
    and hard-to-reach areas.
  - The proposal must outline the systems in place (policies, procedures, guidelines,
    and other tools) that systematically collect, analyse and use programme monitoring
    data.
  - The proposal must include a problem statement, context, and rationale for the
    Programme.
  - The proposal must briefly explain why the proposing organization has the experience,
    capacity and commitment to successfully implement the workplan.
  - The proposal must state programme objectives and expected results, referring to
    Section 1.3 of the 'Background, Application Requirements and Process' document.
  - The proposal must include a detailed description of budgeted activities with clear
    linkages between activities and results.
  - The proposal must include a separate excel spreadsheet with full details of activities
    and associated budget.
  - The proposal must identify major risk factors and actions to address/reduce them.
  - The proposal must outline monitoring and evaluation activities based on a list
    of indicators showing measurable results.
  - The proposal must provide 3 references including name, title, contact information,
    and brief summary of relationship.
