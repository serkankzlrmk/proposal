# donors/usaid_bha.yaml — USAID Bureau for Humanitarian Assistance (BHA)
# Root-level declarative manifest (canonical — Master Spec §2.2 / ARCHITECTURAL_DECISIONS #1)
donor_id: "usaid_bha"
display_name: "USAID Bureau for Humanitarian Assistance (BHA)"
template_standard: "Emergency Application Guidelines (EAG)"
version: "1.1.0"
currency: "USD"

scoring_weights:
  section_coverage: 30
  source_citations: 25
  smart_criteria: 20
  donor_keywords: 15
  budget_alignment: 10

sections:
  mandatory:
    - "executive_summary"
    - "program_rationale"
    - "beneficiary_targeting"
    - "risk_management"
    - "sustainability_exit"

max_char_limits:
  executive_summary: 4000
  program_rationale: 5000
  beneficiary_targeting: 4000
  risk_management: 4000
  sustainability_exit: 4000

min_source_ratio: 0.60        # Emergency concept notes permit lower initial citation density
overhead_cap_percent: 10.0    # De minimis indirect cost rate

mandatory_keywords:
  - "accountability to affected populations"
  - "market analysis"
  - "protection mainstreaming"
  - "do no harm"
  - "psea"

smart_indicators:
  required_dimensions: [specific, measurable, achievable, relevant, time_bound]

hard_eligibility_gates:
  min_displaced_ratio: 0.50   # Minimum 50% IDP/refugee beneficiaries
  psea_policy_mandatory: true

pass_threshold: 70
