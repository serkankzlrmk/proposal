# donors/usaid_bha.yaml — USAID Bureau for Humanitarian Assistance (BHA)
# Template: Emergency Application Guidelines (EAG)
# Source: proposal/engine/donor_rules.py (existing rules, migrated to YAML)
donor_id: "usaid_bha"
name: "USAID Bureau for Humanitarian Assistance (BHA)"
version: "1.0.0"
template: "Emergency Application Guidelines (EAG)"
currency: "USD"

scoring_weights:
  section_coverage: 30
  source_citations: 25
  smart_criteria: 20
  donor_keywords: 15
  budget_alignment: 10

rules:
  sections:
    mandatory:
      - "executive_summary"
      - "program_rationale"
      - "beneficiary_targeting"
      - "risk_management"
      - "sustainability_exit"
    limits:
      executive_summary: {max_chars: 4000}
      program_rationale: {max_chars: 5000}
      beneficiary_targeting: {max_chars: 4000}
      risk_management: {max_chars: 4000}
      sustainability_exit: {max_chars: 4000}

  citations:
    min_source_ratio: 0.75

  smart_indicators:
    required_dimensions: [specific, measurable, achievable, relevant, time_bound]

  keywords:
    expected_tokens:
      - "sphere standards"
      - "psea"
      - "do no harm"
      - "idp"
      - "displacement"

  budget:
    max_overhead_percent: 10.0
    required_categories: [personnel, operational, overhead]
    max_file_size_mb: 10.0

  quota_requirements:
    min_displaced_ratio: 0.50
    psea_mandatory: true
    sphere_standards_mandatory: true

pass_threshold: 70
