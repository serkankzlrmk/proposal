# donors/generic.yaml — Generic Institutional Donor (flexible baseline)
# Root-level declarative manifest (canonical — Master Spec §2.2 / ARCHITECTURAL_DECISIONS #1)
donor_id: "generic"
display_name: "Generic Institutional Donor"
template_standard: "Generic Proposal Template"
version: "1.1.0"
currency: "USD"

scoring_weights:
  section_coverage: 30
  source_citations: 25
  smart_criteria: 20
  donor_keywords: 15
  budget_alignment: 10

sections:
  mandatory:
    - "humanitarian_context"
    - "needs_assessment"
    - "strategic_justification"
    - "logframe"
    - "budget_breakdown"

max_char_limits:
  humanitarian_context: 4000
  needs_assessment: 4000
  strategic_justification: 4000
  logframe: 2000
  budget_breakdown: 2000

min_source_ratio: 0.50        # Flexible baseline
overhead_cap_percent: 7.0

mandatory_keywords:
  - "protection"
  - "gender"
  - "disability"
  - "sustainability"
  - "local partner"

smart_indicators:
  required_dimensions: [specific, measurable, achievable, relevant, time_bound]

hard_eligibility_gates: {}

pass_threshold: 70
