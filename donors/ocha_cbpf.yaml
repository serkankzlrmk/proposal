# donors/ocha_cbpf.yaml — UN OCHA Country-Based Pooled Funds (CBPF)
# Template: GPPi 8+3 Harmonized Proposal
# Source: proposal/engine/donor_rules.py (existing rules, migrated to YAML)
donor_id: "ocha_cbpf"
name: "UN OCHA Country-Based Pooled Funds (CBPF)"
version: "1.0.0"
template: "GPPi 8+3 Harmonized Proposal"
currency: "USD"

scoring_weights:
  section_coverage: 30
  source_citations: 25
  smart_criteria: 20
  donor_keywords: 15
  budget_alignment: 10

rules:
  sections:
    mandatory:
      - "project_summary"
      - "humanitarian_situation"
      - "needs_assessment"
      - "beneficiaries"
      - "justification"
    limits:
      project_summary: {max_chars: 4000}
      humanitarian_situation: {max_chars: 4000}
      needs_assessment: {max_chars: 4000}
      beneficiaries: {max_chars: 4000}
      justification: {max_chars: 4000}

  citations:
    min_source_ratio: 0.75

  smart_indicators:
    required_dimensions: [specific, measurable, achievable, relevant, time_bound]

  keywords:
    expected_tokens:
      - "sadd"
      - "disaggregated"
      - "protection"
      - "gender"
      - "cluster coordination"

  budget:
    max_overhead_percent: 7.0
    required_categories: [personnel, operational, overhead]
    max_file_size_mb: 4.86

  quota_requirements:
    sadd_disaggregation: true
    cluster_coordination_mandatory: true

pass_threshold: 70
